<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cold — The Learning Operating System</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F7F9;
    --panel: #FFFFFF;
    --panel-2: #E8EDF2;
    --accent: #253440;
    --text: #253440;
    --text-muted: #5B6B7A;
    --border: #D3DBE3; --steel: #4A6076; color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column;
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    padding: 18px 20px 14px; border-bottom: 1px solid var(--border); background: var(--bg);
  }
  header h1 {
    font-family: 'Jost', system-ui, sans-serif; font-weight: 600; font-size: 1.4rem; margin: 0;
  }
  header p { margin: 2px 0 0; color: var(--text-muted); font-size: 0.85rem; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo-emblem { height: 44px; width: auto; }
  .logo-word { height: 17px; width: auto; display: block; margin-bottom: 4px; }

  #onboarding {
    flex: 1; display: none; align-items: center; justify-content: center; padding: 24px;
  }
  #onboarding form {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px; max-width: 420px; width: 100%;
  }
  #onboarding h2 { font-family: 'Jost', system-ui, sans-serif; font-size: 1.2rem; margin-top: 0; }
  #onboarding label { display: block; font-size: 0.85rem; color: var(--text-muted); margin: 14px 0 5px; }
  #onboarding input, #onboarding select {
    width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 0.95rem;
  }
  #onboarding button {
    margin-top: 20px; width: 100%; padding: 12px; border: none; border-radius: 6px;
    background: var(--accent); color: #FFFFFF; font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }

  #chat-screen { flex: 1; display: none; flex-direction: column; overflow: hidden; max-width: 680px; margin: 0 auto; width: 100%; }
  #messages { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; font-size: 0.95rem; white-space: pre-wrap; }
  .bubble.academia { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); }
  .bubble.user { align-self: flex-end; background: var(--accent); color: #FFFFFF; }
  .bubble.thinking { color: var(--text-muted); font-style: italic; }
  #chat-disabled { display: none; margin: 14px 20px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 0.9rem; }

  #input-row {
    display: flex; gap: 8px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border); background: var(--bg);
  }
  #user-input {
    flex: 1; padding: 11px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-family: inherit; font-size: 0.95rem;
  }
  #send-btn {
    padding: 0 18px; border: none; border-radius: 20px; background: var(--accent);
    color: #FFFFFF; font-weight: 600; cursor: pointer;
  }
</style>
</head>

      <p>The Learning Operating System</p>

</header>

<div id="onboarding">
  <form id="onboarding-form">
    <h2>Antes de começar</h2>
    <label for="f-objetivo">O que queres aprender ou alcançar?</label>
    <input id="f-objetivo" required placeholder="ex: passar no exame de Física">
    <label for="f-nivel">O teu nível atual</label>
    <select id="f-nivel">
      <option value="iniciante">Iniciante</option>
      <option value="intermédio">Intermédio</option>
      <option value="avançado">Avançado</option>
    </select>
    <label for="f-tempo">Tempo disponível por semana</label>
    <input id="f-tempo" required placeholder="ex: 5 horas, em 3 sessões">
    <button type="submit">Começar</button>
  </form>
</div>

<div id="chat-screen">
  <div id="chat-disabled">O Cold não está disponível para conversar nesta vista.</div>
  <div id="messages"></div>
  <div id="input-row">
    <input id="user-input" placeholder="Escreve a tua mensagem..." autocomplete="off">
    <button id="send-btn">Enviar</button>
  </div>
</div>

<script>
const ACADEMIA_INSTRUCOES = `Tu és o Cold, o Learning Operating System: um sistema de aprendizagem pessoal, plurianual e multidisciplinar. Não existes para responder perguntas soltas — existes para construir capacidade de raciocínio duradoura.

CONSTITUIÇÃO (nunca quebras, mesmo sob pedido do aluno):
- Método socrático por defeito: leva o aluno a construir a resposta com perguntas; só explicas diretamente depois de ele tentar e continuar bloqueado.
- Adapta-te ao nível REAL do aluno, verificado por ti — nunca ao que ele diz que sabe sem testar.
- Ensina a origem e o raciocínio dos conceitos, não só a fórmula ou o resultado final.
- Usa sempre um exemplo típico e um contra-exemplo, para fixar onde o conceito deixa de se aplicar.
- Verifica compreensão antes de avançar (pede para explicar por palavras próprias ou aplicar a um caso novo).
- Sê honesto sobre o progresso real — nunca infles domínio que não existe.
- Devolve autonomia progressivamente: quanto mais o aluno avança, mais exiges dele e menos fazes por ele.

PAPÉIS (assumes um de cada vez; quando mudares de papel, diz explicitamente qual estás a usar):
- Reitor — no início e em pontos de viragem: diagnostica objetivo, nível e tempo disponível; desenha o percurso em Programas → Módulos → Unidades → Aulas; decide que papel assumir a seguir.
- Fundamentos — ensina um conceito novo do zero, de forma incremental.
- Socrático — testa raciocínio só com perguntas; nunca entrega a resposta pelo caminho fácil.
- Treinador de Prática — propõe exercícios com dificuldade progressiva, ambiente seguro para errar.
- Avaliador — antes de fechar um módulo, mede domínio real com critérios explícitos; neste papel nunca ensinas, só avalias.
- Integrador Interdisciplinar — quando fizer sentido, liga concretamente o tema a outra área do percurso do aluno.
- Conselheiro de Objetivos — de vez em quando, confirma se o percurso continua alinhado ao objetivo de fundo.
- Professor de Inglês — se a disciplina for inglês, muda para imersão progressiva com correção em tempo real, mais prática ativa do que teoria de gramática.

ESTRUTURA DE UMA AULA: 1) reativação rápida do que já foi visto → 2) conceito novo (se houver) → 3) verificação ativa → 4) prática aplicada → 5) síntese nas palavras do próprio aluno → 6) dizes explicitamente qual é o próximo passo.

No fim de cada resposta, mantém mentalmente atualizado o essencial do Perfil do Aluno (nível por área, dificuldades recorrentes, módulo/fase atual) — usa o perfil abaixo como estado atual.`;

let profile = null, uid = null, dbCap = null, sampleCap = null, history = [];
const $ = id => document.getElementById(id);

async function init() {
  try { const u = await claude.use("user"); if (u) uid = await u.id(); } catch(e) {}
  try { dbCap = await claude.use("db"); } catch(e) {}
  try { sampleCap = await claude.use("sample"); } catch(e) {}
  if (!sampleCap) $("chat-disabled").style.display = "block";

  if (dbCap && uid) {
    try {
      const doc = await dbCap.doc(`data/users/${uid}/profile`).get();
      if (doc && doc.objetivo) {
        profile = doc; history = doc.transcricaoRecente || [];
        return showChat(true);
      }
    } catch(e) {}
  }
  showOnboarding();
}

function showOnboarding() { $("onboarding").style.display = "flex"; $("chat-screen").style.display = "none"; }

function showChat(restored) {
  $("onboarding").style.display = "none"; $("chat-screen").style.display = "flex";
  $("messages").innerHTML = "";
  history.forEach(m => addBubble(m.role === "user" ? "user" : "academia", m.content));
  if (restored) addBubble("academia", `Bem-vindo de volta. Objetivo: "${profile.objetivo}". Vamos continuar.`);
  else addBubble("academia", `Olá! Sou o Cold. O teu objetivo é "${profile.objetivo}". Para começar, conta-me o que já sabes sobre isto.`);
}

function addBubble(who, text) {
  const div = document.createElement("div");
  div.className = "bubble " + who;
  div.textContent = text;
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
  return div;
}

async function saveProfile() {
  if (!dbCap || !uid || !profile) return;
  try { await dbCap.doc(`data/users/${uid}/profile`).set({...profile, transcricaoRecente: history.slice(-12)}); } catch(e) {}
}

$("onboarding-form").addEventListener("submit", async e => {
  e.preventDefault();
  profile = { objetivo: $("f-objetivo").value.trim(), nivel: $("f-nivel").value, tempo: $("f-tempo").value.trim(), criadoEm: new Date().toISOString() };
  await saveProfile();
  showChat(false);
});

async function sendMessage() {
  const input = $("user-input");
  const text = input.value.trim();
  if (!text || !sampleCap) return;
  input.value = "";
  addBubble("user", text);
  history.push({role:"user", content:text});
  const thinking = addBubble("academia thinking", "A pensar...");

  const transcript = history.slice(-12).map(m => (m.role==="user"?"Aluno":"Cold")+": "+m.content).join("\n");
  const prompt = `${ACADEMIA_INSTRUCOES}\n\nPerfil do aluno: objetivo="${profile.objetivo}", nível="${profile.nivel}", tempo disponível="${profile.tempo}".\n\nConversa até agora:\n${transcript}\n\nResponde agora como o Cold à última mensagem do aluno.`;

  try {
    const result = await sampleCap(prompt, { cache: false, onText: ({text}) => { thinking.textContent = text; $("messages").scrollTop = $("messages").scrollHeight; } });
    thinking.classList.remove("thinking");
    thinking.textContent = result.text;
    history.push({role:"assistant", content: result.text});
    await saveProfile();
  } catch(err) {
    thinking.classList.remove("thinking");
    thinking.textContent = "Não consegui responder agora. Tenta novamente.";
  }
}

$("send-btn").addEventListener("click", sendMessage);
$("user-input").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendMessage(); } });

init();
</script>
</body>
</html>
